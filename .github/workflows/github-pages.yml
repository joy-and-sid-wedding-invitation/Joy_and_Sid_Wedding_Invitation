# Deploy the production client assets to GitHub Pages.
# Set Pages source to "GitHub Actions" in the repo settings.
#
# RSVP / Neon still need a Node host (Lovable, Cloudflare, etc.).
# This workflow publishes the static client build so invitation images load
# at https://<user>.github.io/Joy_and_Sid_Wedding_Invitation/

name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Nitro writes client assets to .output/public (there is no dist/client).
      - name: Generate GitHub Pages index.html
        run: node scripts/pages-index.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
