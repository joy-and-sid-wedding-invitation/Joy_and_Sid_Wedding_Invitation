# Deploy the production client assets to GitHub Pages.
#
# ONE-TIME SETUP (required or deploy-pages returns 404):
#   1. Open https://github.com/teresa-at-49/Joy_and_Sid_Wedding_Invitation/settings/pages
#   2. Under "Build and deployment" → Source → choose "GitHub Actions"
#   3. Save, then re-run this workflow (Actions → GitHub Pages → Re-run jobs)
#
# RSVP / Neon still need a Node host (Lovable, Cloudflare, etc.).
# This workflow publishes a SPA shell + static assets at
# https://teresa-at-49.github.io/Joy_and_Sid_Wedding_Invitation/

name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # SPA mode (vite.config when GITHUB_PAGES=true) writes a hydrateable
      # index.html under dist/client — not .output/public (Nitro is off).
      - run: npm run build
      - name: Ensure 404.html for client-side routes
        run: node scripts/pages-index.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
